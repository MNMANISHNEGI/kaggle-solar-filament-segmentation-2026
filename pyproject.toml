[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "filament-seg"
version = "0.2.0"
description = "Instance segmentation of solar filaments in GONG H-alpha observations (Solar Filament Segmentation Challenge 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
